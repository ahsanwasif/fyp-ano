global: {scrape_interval: 10s, evaluation_interval: 10s}
rule_files: [/etc/prometheus/alert.rules.yml]
alerting:
  alertmanagers: [{static_configs: [{targets: ["alertmanager:9093"]}]}]
scrape_configs:
  - job_name: gnmic
    static_configs: [{targets: ["gnmic:9804"]}]
  - job_name: ano-ssh          # ano/ssh_exporter.py: devices with no gNMI/SNMP/SuzieQ path (e.g. FRR, SR Linux)
    static_configs: [{targets: ["host.docker.internal:9805"]}]
