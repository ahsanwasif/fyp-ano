  ospf:
    process_id: 1
  bgp:
  - device: s4
    asn: 65004
    ebgp_without_policy: false
    networks:
    - 10.40.40.0/24
    neighbors:
    - ip: 203.0.113.1
      remote_as: 64999
      description: isp
      update_source: null
  static_routes:
  - device: s4
    vrf: GUEST
    prefix: 0.0.0.0/0
    next_hop: blackhole
policies:
- name: no-telnet-br-to-hq
  action: deny
  src: 10.40.40.0/24
  dst: 10.10.10.0/24
  protocol: tcp
  dst_port: 23
  apply_on: s4:Ethernet3
  direction: in
  sequence: 10
- name: no-rdp-br-to-hq
  action: deny
  src: 10.40.40.0/24
  dst: 10.10.10.0/24
  protocol: tcp
  dst_port: 3389
  apply_on: s4:Ethernet3
  direction: in
  sequence: 20
services:
  ntp: []
  dns: []
  syslog: []
acceptance_tests:
- name: hq-to-branch
  from: s1:Vlan10
  src: 10.10.10.0/24
  dst: 10.40.40.0/24
  protocol: icmp
  expect: permit
- name: branch-to-hq-http
  from: s4:Ethernet3
  src: 10.40.40.0/24
  dst: 10.10.10.0/24
  protocol: tcp
  dst_port: 80
  expect: permit
- name: branch-to-hq-telnet
  from: s4:Ethernet3
  src: 10.40.40.0/24
  dst: 10.10.10.0/24
  protocol: tcp
  dst_port: 23
  expect: deny
- name: branch-to-hq-rdp
  from: s4:Ethernet3
  src: 10.40.40.0/24
  dst: 10.10.10.0/24
  protocol: tcp
  dst_port: 3389
  expect: deny
- name: guest-isolated-from-hq
  from: s4:Ethernet4
  src: 10.44.44.0/24
  dst: 10.10.10.0/24
  protocol: ip
  expect: deny
failure_tests:
- name: survive-lag-down
  down:
  - s1:Port-Channel1
  then: hq-to-branch
- name: survive-s3-s4-down
  down:
  - s4:Ethernet2
  then: branch-to-hq-http
emulation_images:
  arista_ceos: env:ANO_IMAGE_ARISTA_CEOS
change_constraints:
  devices_allowed:
  - s1
  - s2
  - s3
  - s4
  commit_confirm_seconds: 300
monitoring:
  allowed:
  - gnmi
  - ssh
  gnmi_port: 6030
  alert_webhook: http://host.docker.internal:5001/alert
