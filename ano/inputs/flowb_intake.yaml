# Flow B on Arista cEOS: everything the user must state. No field has a default; leaving one out is a question.
# HQ (s1) + branch (s4) over two paths (s2 via a 2-member LAG, s3). Also: VLAN 10 + SVI at HQ, an isolated GUEST VRF
# and an eBGP peering to the ISP at the branch, two filter rules on one interface. Add devices/links/tests to scale.
intent: Connect HQ VLAN 10 (10.10.10.0/24) and the branch LAN 10.40.40.0/24 with OSPF over two paths (one a 2-link LAG), keep a guest VRF at the
  branch isolated, peer eBGP with the ISP at the branch, block telnet and RDP from branch to HQ.
starting_point: greenfield
