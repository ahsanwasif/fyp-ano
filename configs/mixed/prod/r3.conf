! Flow A test, mixed lab (routers + Linux firewall + Linux server): plays the user's REAL network.
! it only gets the management range 172.31.4.0/24 and the logins (routers admin/admin, Linux lxadmin/ano-lab).
frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.13.1/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 ip address 10.0.23.1/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth3
 ip address 10.3.3.1/24
 ip ospf area 0
 ip ospf passive
!
interface lo
 ip address 10.255.0.3/32
 ip ospf area 0
 ip ospf passive
!
router ospf
 redistribute static
 ospf router-id 10.255.0.3
!
ip route 10.4.4.0/24 10.3.3.2
!
