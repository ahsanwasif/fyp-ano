! Flow A test, FRR lab: this plays the user's REAL network. ANO never reads this file;
! it only gets the management range 172.31.1.0/24 and the SSH login (admin/admin, set by containerlab).
frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.12.1/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 ip address 10.0.23.0/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface lo
 ip address 10.255.0.2/32
 ip ospf area 0
 ip ospf passive
!
router ospf
 ospf router-id 10.255.0.2
!
