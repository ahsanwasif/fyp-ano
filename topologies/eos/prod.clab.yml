# Flow A test: this lab plays the role of the user's REAL network.
# ANO is not allowed to read this file. It only gets: the mgmt range 172.31.1.0/24 + SSH credentials.
name: ano-prod
mgmt:
  network: ano-prod-mgmt
  ipv4-subnet: 172.31.1.0/24
topology:
  kinds:
    arista_ceos:
      image: ${ANO_IMAGE_ARISTA_CEOS}
  nodes:
    r1: {kind: arista_ceos, mgmt-ipv4: 172.31.1.11, startup-config: ../../configs/eos/prod/r1.cfg}
    r2: {kind: arista_ceos, mgmt-ipv4: 172.31.1.12, startup-config: ../../configs/eos/prod/r2.cfg}
    r3: {kind: arista_ceos, mgmt-ipv4: 172.31.1.13, startup-config: ../../configs/eos/prod/r3.cfg}
    h1:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      mgmt-ipv4: 172.31.1.21
      exec:
        - ip addr add 10.1.1.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.1.1.1
    h2:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      mgmt-ipv4: 172.31.1.22
      exec:
        - ip addr add 10.3.3.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.3.3.1
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r1:eth2", "r3:eth2"]
    - endpoints: ["r1:eth3", "h1:eth1"]
    - endpoints: ["r3:eth3", "h2:eth1"]
