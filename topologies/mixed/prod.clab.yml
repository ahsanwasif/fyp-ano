# Flow A test, mixed lab: 3 FRR routers, a Linux firewall (fw1) and a Linux server (srv1). Plays the REAL network.
#   h1 (10.1.1.10) -- r1 -- r2 -- r3 -- fw1 -- srv1 (10.4.4.10)
# ANO only gets: the mgmt range 172.31.4.0/24 + two logins (routers admin/admin, Linux lxadmin/ano-lab).
#   export ANO_IMAGE_FRR=quay.io/frrouting/frr:containerlab-10.7.1
#   docker build -t ano-linux:1 ../../setup/images/ano-linux && export ANO_IMAGE_LINUX=ano-linux:1
#   sudo -E containerlab deploy -t prod.clab.yml
name: ano-mixed
mgmt:
  network: ano-mixed-mgmt
  ipv4-subnet: 172.31.4.0/24
topology:
  kinds:
    frr: {image: "${ANO_IMAGE_FRR}", daemons: [ospfd, staticd]}
    linux: {image: "${ANO_IMAGE_LINUX}"}
  nodes:
    r1: {kind: frr, mgmt-ipv4: 172.31.4.11, startup-config: ../../configs/mixed/prod/r1.conf}
    r2: {kind: frr, mgmt-ipv4: 172.31.4.12, startup-config: ../../configs/mixed/prod/r2.conf}
    r3: {kind: frr, mgmt-ipv4: 172.31.4.13, startup-config: ../../configs/mixed/prod/r3.conf}
    fw1:
      kind: linux
      mgmt-ipv4: 172.31.4.21
      binds: ["../../configs/mixed/prod/fw1.sh:/lab/start.sh:ro"]
      exec: ["sh /lab/start.sh"]
    srv1:
      kind: linux
      mgmt-ipv4: 172.31.4.22
      binds: ["../../configs/mixed/prod/srv1.sh:/lab/start.sh:ro"]
      exec: ["sh /lab/start.sh"]
    h1:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      mgmt-ipv4: 172.31.4.31
      exec: ["ip addr add 10.1.1.10/24 dev eth1", "ip route add 10.0.0.0/8 via 10.1.1.1"]
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r2:eth2", "r3:eth2"]
    - endpoints: ["r1:eth3", "h1:eth1"]
    - endpoints: ["r3:eth3", "fw1:eth1"]
    - endpoints: ["fw1:eth2", "srv1:eth1"]
