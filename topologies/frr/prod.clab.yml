# Flow A test (no vendor login needed): this lab plays the role of the user's REAL network.
# ANO is not allowed to read this file. It only gets: the mgmt range 172.31.1.0/24 + SSH login admin/admin.
#   export ANO_IMAGE_FRR=quay.io/frrouting/frr:containerlab-10.7.1     (first FRR release with SSH built in)
#   sudo -E containerlab deploy -t prod.clab.yml
name: ano-prod
mgmt:
  network: ano-prod-mgmt
  ipv4-subnet: 172.31.1.0/24
topology:
  kinds:
    frr:
      image: ${ANO_IMAGE_FRR}
      daemons: [ospfd, bgpd]
  nodes:
    r1: {kind: frr, mgmt-ipv4: 172.31.1.11, startup-config: ../../configs/frr/prod/r1.conf}
    r2: {kind: frr, mgmt-ipv4: 172.31.1.12, startup-config: ../../configs/frr/prod/r2.conf}
    r3: {kind: frr, mgmt-ipv4: 172.31.1.13, startup-config: ../../configs/frr/prod/r3.conf}
    h1:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      mgmt-ipv4: 172.31.1.21
      exec:
        - ip addr add 10.1.1.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.1.1.1
    h2:
      kind: linux
      image: ghcr.io/hellt/network-multitool:latest
      mgmt-ipv4: 172.31.1.22
      exec:
        - ip addr add 10.3.3.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.3.3.1
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r2:eth2", "r3:eth2"]
    - endpoints: ["r1:eth3", "h1:eth1"]
    - endpoints: ["r3:eth3", "h2:eth1"]
